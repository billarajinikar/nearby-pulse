# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "41f4fdb9bae1f212262e354d51a534b8"
name = "NearbyPulse"
handle = nearbypulse-23
application_url = "https://app.nearbypulse.app"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_app_proxy,write_metaobject_definitions,write_metaobjects,write_products,read_orders"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [ "https://app.nearbypulse.app/auth/callback" ]

[app_proxy]
url = "https://app.nearbypulse.app/api/nearby-activity"
subpath = "nearby-pulse"
prefix = "apps"

[[extensions]]
name = "nearby-pulse-extension"
handle = "social-proof"
type = "theme"
path = "extensions/nearby-pulse-extension"
